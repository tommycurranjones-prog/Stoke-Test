name: Update Stoke Data

on:
  schedule:
    - cron: '0 3 * * 1' # Runs automatically every Monday at 3 AM
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Scraper
        run: python build_stoke_db.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stoke_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update stoke_data.json"
          git push
