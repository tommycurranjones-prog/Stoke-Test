<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stoke Test</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-red: #e11d48;
            --accent-green: #10b981;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1; pointer-events: none;
            opacity: 0.6;
        }
        .container {
            z-index: 10;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 3rem; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 500px; width: 90%;
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px;}
        p.subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .search-box {
            display: flex; gap: 10px; margin-bottom: 2rem;
        }
        input {
            flex: 1; padding: 12px 16px;
            border-radius: 8px; border: none;
            background: #1e293b; color: white;
            font-size: 1rem; outline: none;
            border: 1px solid transparent;
            transition: border 0.3s;
        }
        input:focus { border: 1px solid var(--accent-red); }
        button {
            padding: 12px 24px; border-radius: 8px;
            border: none; background: var(--accent-red);
            color: white; font-weight: bold; font-size: 1rem;
            cursor: pointer; transition: transform 0.1s, background 0.3s;
        }
        button:active { transform: scale(0.95); }
        button:hover { background: #be123c; }
        
        #result-box {
            display: none; padding: 1.5rem;
            border-radius: 8px; margin-top: 1rem;
            animation: fadeIn 0.5s ease;
        }
        .success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent-green); }
        .failure { background: rgba(225, 29, 72, 0.2); border: 1px solid var(--accent-red); }
        .stat { color: #cbd5e1; font-size: 0.9rem; margin-top: 8px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="container">
        <h1>The Stoke Test</h1>
        <p class="subtitle">> 5PM | < 8°C | Raining | > 8.0 Rating</p>
        
        <div class="search-box">
            <input type="text" id="playerInput" placeholder="Enter footballer name (e.g. Lionel Messi)" autocomplete="off">
            <button onclick="checkPlayer()">Test</button>
        </div>

        <div id="result-box"></div>
    </div>

    <script>
        let stokeDatabase = {};

        // Load the JSON data generated by the Python script
        fetch('stoke_data.json')
            .then(response => response.json())
            .then(data => {
                stokeDatabase = data.stoked_players;
                console.log("Database loaded!", data);
            })
            .catch(err => console.error("Could not load database. Make sure stoke_data.json exists.", err));

        function checkPlayer() {
            const input = document.getElementById('playerInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('result-box');
            if(!input) return;

            resultBox.style.display = 'block';
            resultBox.className = ''; 

            if(stokeDatabase[input]) {
                const p = stokeDatabase[input];
                resultBox.classList.add('success');
                resultBox.innerHTML = `
                    <h2 style="color: #10b981; margin:0 0 10px 0;">YES! HE DID IT.</h2>
                    <p style="margin:0;"><strong>${p.name}</strong> conquered the cold rainy night.</p>
                    <div class="stat">Date: ${p.match_date}</div>
                    <div class="stat">Team: ${p.team}</div>
                    <div class="stat">Temp: ${p.temp}°C | Sofascore: ${p.rating}/10</div>
                `;
            } else {
                resultBox.classList.add('failure');
                resultBox.innerHTML = `
                    <h2 style="color: #e11d48; margin:0 0 10px 0;">NOPE.</h2>
                    <p style="margin:0;">No record of this player passing the Stoke Test.</p>
                    <div class="stat">They either never played, played in good weather, or couldn't hack it.</div>
                `;
            }
        }

        // Allow pressing 'Enter' to search
        document.getElementById('playerInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPlayer();
        });

        // Background Rain Animation
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let drops = [];

        for (let i = 0; i < 400; i++) {
            drops.push({
                x: Math.random() * width, y: Math.random() * height,
                l: Math.random() * 20 + 10, v: Math.random() * 15 + 10
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < drops.length; i++) {
                let d = drops[i];
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x + d.l * 0.1, d.y + d.l);
                d.y += d.v;
                d.x += d.v * 0.1; 
                if (d.y > height) {
                    d.y = -20; d.x = Math.random() * width;
                }
            }
            ctx.stroke();
            requestAnimationFrame(drawRain);
        }
        drawRain();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
