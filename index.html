<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stoke Test | Quiz</title>
    
    <!-- Open Graph Tags for Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Stoke Test Quiz">
    <meta property="og:description" content="Can you guess who actually did it on a cold rainy night in Stoke?">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --accent-red: #e11d48;
            --accent-green: #10b981;
            --accent-blue: #2563eb;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1; pointer-events: none;
            opacity: 0.5;
        }
        .container {
            z-index: 10;
            text-align: center;
            background: var(--card-bg);
            padding: 2.5rem; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 480px; width: 90%;
        }
        h1 { font-size: 2.2rem; margin: 0 0 0.3rem 0; text-transform: uppercase; letter-spacing: 2px; }
        .criteria { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; font-weight: 600; }
        
        .score-board {
            display: flex; justify-content: space-around;
            background: rgba(15, 23, 42, 0.6); padding: 10px;
            border-radius: 8px; margin-bottom: 1.5rem;
            font-weight: bold; font-size: 0.95rem;
        }
        .score-val { color: var(--accent-green); }
        .streak-val { color: #f59e0b; }

        .player-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1.5rem;
        }
        .player-label { text-transform: uppercase; font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }
        .player-name { font-size: 1.8rem; font-weight: 800; margin: 8px 0; color: #ffffff; }

        .btn-group {
            display: flex; gap: 12px; justify-content: center;
        }
        .choice-btn {
            flex: 1; padding: 14px 10px; border-radius: 10px;
            border: none; font-weight: 800; font-size: 1rem;
            cursor: pointer; transition: transform 0.1s, background 0.2s;
            color: white; text-transform: uppercase;
        }
        .choice-btn:active { transform: scale(0.96); }
        .btn-yes { background: var(--accent-green); }
        .btn-yes:hover { background: #059669; }
        .btn-no { background: var(--accent-red); }
        .btn-no:hover { background: #be123c; }

        #result-box {
            display: none; padding: 1.2rem;
            border-radius: 10px; margin-top: 1.2rem;
            animation: fadeIn 0.4s ease;
            text-align: left;
        }
        .verdict-header { font-size: 1.3rem; font-weight: bold; margin-bottom: 6px; text-align: center; }
        .verdict-correct { color: var(--accent-green); }
        .verdict-wrong { color: var(--accent-red); }

        .stat-line { font-size: 0.88rem; color: #cbd5e1; margin-top: 4px; }
        
        .action-btn {
            width: 100%; margin-top: 12px; padding: 10px;
            background: var(--accent-blue); border: none; border-radius: 8px;
            color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem;
        }
        .action-btn:hover { background: #1d4ed8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="container">
        <h1>The Stoke Test</h1>
        <div class="criteria">> 5PM | < 8°C | Raining | > 8.0 Rating</div>

        <div class="score-board">
            <div>Score: <span id="score" class="score-val">0</span></div>
            <div>Streak: <span id="streak" class="streak-val">0</span> 🔥</div>
        </div>

        <div class="player-card">
            <div class="player-label">Could he do it on a cold rainy night in Stoke?</div>
            <div class="player-name" id="playerName">Loading player...</div>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="choice-btn btn-yes" onclick="makeGuess(true)">🟢 YES</button>
            <button class="choice-btn btn-no" onclick="makeGuess(false)">🔴 NO</button>
        </div>

        <div id="result-box"></div>
    </div>

    <script>
        // Preset list of notable players to test against
        const playerPool = [
            "Lionel Messi", "Cristiano Ronaldo", "Robin van Persie", "Eden Hazard",
            "Sergio Agüero", "Alexis Sánchez", "Mesut Özil", "Wayne Rooney",
            "Didier Drogba", "Kevin De Bruyne", "Mohamed Salah", "Thierry Henry",
            "Frank Lampard", "Steven Gerrard", "Harry Kane", "Gareth Bale",
            "Diego Costa", "Cesc Fàbregas", "David Silva", "Luis Suárez",
            "Carlos Tevez", "Fernando Torres", "Romelu Lukaku", "Riyad Mahrez"
        ];

        let stokeDatabase = {};
        let currentChoiceIndex = 0;
        let score = 0;
        let streak = 0;
        let playedIndices = [];

        // Fetch database generated by Python script
        fetch('stoke_data.json')
            .then(res => res.json())
            .then(data => {
                stokeDatabase = data.stoked_players || {};
                loadNextPlayer();
            })
            .catch(err => {
                console.error("Database not found, using empty set.", err);
                loadNextPlayer();
            });

        function loadNextPlayer() {
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('btnGroup').style.display = 'flex';

            if (playedIndices.length >= playerPool.length) {
                playedIndices = []; // Reset pool loop
            }

            let randIndex;
            do {
                randIndex = Math.floor(Math.random() * playerPool.length);
            } while (playedIndices.includes(randIndex));

            playedIndices.push(randIndex);
            currentChoiceIndex = randIndex;

            document.getElementById('playerName').innerText = playerPool[currentChoiceIndex];
        }

        function makeGuess(userGuessedYes) {
            const playerRaw = playerPool[currentChoiceIndex];
            const playerKey = playerRaw.toLowerCase();
            const didStoke = stokeDatabase.hasOwnProperty(playerKey);
            const resultBox = document.getElementById('result-box');
            
            document.getElementById('btnGroup').style.display = 'none';
            resultBox.style.display = 'block';

            const isCorrect = (userGuessedYes === didStoke);

            if (isCorrect) {
                score++;
                streak++;
                document.getElementById('score').innerText = score;
                document.getElementById('streak').innerText = streak;
            } else {
                streak = 0;
                document.getElementById('streak').innerText = streak;
            }

            let html = `<div class="verdict-header ${isCorrect ? 'verdict-correct' : 'verdict-wrong'}">`;
            html += isCorrect ? "🎉 CORRECT!" : "❌ WRONG!";
            html += `</div>`;

            if (didStoke) {
                const info = stokeDatabase[playerKey];
                html += `<p style="margin:5px 0 10px 0;"><strong>${info.name}</strong> PASSED the Stoke Test!</p>`;
                html += `<div class="stat-line">📅 Date: ${info.match_date}</div>`;
                html += `<div class="stat-line">🛡️ Opponent: ${info.team}</div>`;
                html += `<div class="stat-line">🌧️ Weather: ${info.temp}°C (Raining)</div>`;
                html += `<div class="stat-line">⭐ Rating: ${info.rating}/10</div>`;
            } else {
                html += `<p style="margin:5px 0 10px 0;"><strong>${playerRaw}</strong> NEVER passed the Stoke Test.</p>`;
                html += `<div class="stat-line">They either never played at Stoke in an evening match, the weather was too mild, or they failed to score an 8.0+ rating.</div>`;
            }

            html += `<button class="action-btn" onclick="loadNextPlayer()">Next Footballer ➔</button>`;
            html += `<button class="action-btn" style="background:#475569;" onclick="shareScore()">Share Result 🚀</button>`;

            resultBox.className = isCorrect ? 'verdict-correct' : 'verdict-wrong';
            resultBox.style.border = `1px solid ${isCorrect ? 'var(--accent-green)' : 'var(--accent-red)'}`;
            resultBox.style.background = isCorrect ? 'rgba(16, 185, 129, 0.15)' : 'rgba(225, 29, 72, 0.15)';
            resultBox.innerHTML = html;
        }

        function shareScore() {
            const text = `I'm on a ${streak} streak testing footballers on a cold rainy night in Stoke! Can you beat my score?`;
            if (navigator.share) {
                navigator.share({ title: 'The Stoke Test', text: text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(`${text} ${window.location.href}`);
                alert("Score copied to clipboard!");
            }
        }

        // Background Rain Animation
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let drops = [];

        for (let i = 0; i < 350; i++) {
            drops.push({
                x: Math.random() * width, y: Math.random() * height,
                l: Math.random() * 20 + 10, v: Math.random() * 14 + 8
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < drops.length; i++) {
                let d = drops[i];
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x + d.l * 0.1, d.y + d.l);
                d.y += d.v; d.x += d.v * 0.1;
                if (d.y > height) { d.y = -20; d.x = Math.random() * width; }
            }
            ctx.stroke();
            requestAnimationFrame(drawRain);
        }
        drawRain();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
